<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


<body>

    <h1>Formularios</h1>
    <hr>

    <form>

        <!-- Input Texto (permite ingresar texto) -->
        <label for="usuario">Usuario: </label>
        <input type="text" id="usuario" name="usuario" placeholder="Escribe Aqui Tu Usuario">

        <br>
        <br>

        <!-- Input Contraseña (permite ingresar contraseña que sera tapada por puntos negros) -->
        <label for="password">Contraseña: </label>
        <input type="password" id="password" name="password" placeholder="Escribe Aqui Tu Contraseña">

        <br>
        <br>

        <!-- Input CheckBox (permite seleccion multiple) -->
        <label for="lenguajes">Lenguajes de Programación que sabe:</label>
        <input type="checkbox" name="lenguajes" id="html">HTML
        <input type="checkbox" name="lenguajes" id="css">CSS
        <input type="checkbox" name="lenguajes" id="javascript">JavaScript
        <input type="checkbox" name="lenguajes" id="python">Python

        <br>
        <br>

        <!-- Input Radio (permite solo una seleccion) -->
        <label for="conocimiento">Que lenguaje trabajara: </label>
        <input type="radio" name="conocimiento" id="java">Java
        <input type="radio" name="conocimiento" id="python">Python
        <input type="radio" name="conocimiento" id="rust">Rust
        <input type="radio" name="conocimiento" id="cobol">Cobol

        <br>
        <br>

        <!-- Input Number (permite ingresar solo numeros) -->
        <label for="programando">Años Programando: </label>
        <input type="number" name="programando" id="programando" placeholder="Ingresa Numero Años Programando">

        <br>
        <br>

        <!-- Input Archivo (permite cargar y subir un archivo) -->
        <label for="archivo">Sube Tu Archivo: </label>
        <input type="file" id="archivo" name="archivo" value="file">

        <br>
        <br>

        <!-- Textarea (permite ingresar texto multilinea) -->
        <label for="opinion">Escribe Tu Opinion: </label>
        <textarea id="opinion" name="opinion" placeholder="Escribe Aca Tu Opinion"></textarea>

        <br>
        <br>

        <!-- Select (Opciones Desplegables) -->
        <label for="pais">Selecciona Tu Pais De Origen: </label>
        <select name="pais" id="pais">
            <!--Opcion selected, aparece escojida o seleccionada por defecto--> 
            <option value="selecciona" selected="selected">Escoje Tu Pais</option>
            <option value="colombia">Colombia</option>
            <option value="mexico">Mexico</option>
            <option value="brasil">Brasil</option>
            <option value="venezuela">Venezuela</option>
        </select>

        <br>
        <br>

        <!-- Select (Opciones En Grupo Desplegables) -->
        <label for="paises">Selecciona Tu Pais: </label>
        <select name="paises" id="paises">

            <option value="na" selected="selected">Selecciona</option>
            <optgroup label="Sur America">
                <option value="colombia">Colombia</option>
                <option value="ecuador">Ecuador</option>
                <option value="argentina">Argentina</option>
                <option value="chile">Chile</option>
                <option value="venezuela">Venezuela</option>
            </optgroup>

            <optgroup label="Europa">
                <option value="alemania">Alemania</option>
                <option value="francia">Francia</option>
                <option value="españa">España</option>
                <option value="italia">Italia</option>
                <option value="rumania">Rumania</option>
            </optgroup>

            <optgroup label="Asia">
                <option value="japon">Japon</option>
                <option value="rusia">Rusia</option>
                <option value="india">India</option>
                <option value="china">China</option>
                <option value="iran">Iran</option>
            </optgroup>
        </select>

        <br>
        <br>

    </form>
</body>
</html>
